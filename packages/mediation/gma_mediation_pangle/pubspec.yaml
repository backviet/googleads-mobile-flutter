name: gma_mediation_pangle
description: "Mediation Adapter that enables sending ad requests to the Pangle ad network using the google_mobile_ads plugin."
version: 4.0.1
repository: https://github.com/googleads/googleads-mobile-flutter/tree/main/packages/mediation/gma_mediation_pangle
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads:
    # path: ../../google_mobile_ads
    git:
      url: https://github.com/backviet/googleads-mobile-flutter.git
      path: packages/google_mobile_ads
      ref: bd37abef8378bfcdde0b51c296a084aae73ab38b
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lint: ^2.3.0

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.googlemobileads.mediation.gma_mediation_pangle
        pluginClass: GmaMediationPanglePlugin
      ios:
        pluginClass: GmaMediationPanglePlugin
