name: gma_mediation_dtexchange
description: "Mediation Adapter that enables sending ad requests to the DT Exchange ad network using the google_mobile_ads plugin."
version: 1.1.5
repository: https://github.com/googleads/googleads-mobile-flutter/tree/main/packages/mediation/gma_mediation_dtexchange
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads:
    # path: ../../google_mobile_ads
    git:
      url: https://github.com/backviet/googleads-mobile-flutter.git
      path: packages/google_mobile_ads
      ref: 49764803c81211ed1e1ca718f7bd1e879b9435b0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  lint: ^2.3.0
  pigeon: ^19.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.googlemobileads.mediation.gma_mediation_dtexchange
        pluginClass: GmaMediationDTExchangePlugin
      ios:
        pluginClass: GmaMediationDTExchangePlugin
